name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (PHP 8.5.3)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: healthcare_referral
          MYSQL_USER: healthcare
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: rootsecret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootsecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli -h 127.0.0.1 ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5.3"
          extensions: mbstring, pdo_mysql, redis, zip, bcmath, pcntl, exif, gd
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer (vendor + downloads)
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Set CI environment variables
        run: |
          {
            echo "APP_ENV=testing"
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=mysql"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=healthcare_referral"
            echo "DB_USERNAME=healthcare"
            echo "DB_PASSWORD=secret"
            echo "REDIS_HOST=redis"
            echo "REDIS_PORT=6379"
            echo "CACHE_DRIVER=redis"
            echo "QUEUE_CONNECTION=sync"
            echo "PATIENT_ID_HMAC_KEY=test_hmac_key_for_ci_only"
          } >> .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -prootsecret && break
            sleep 2
          done

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

      - name: Run Pint (code style)
        run: ./vendor/bin/pint --test
